<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona zapisu do klubu rowerowego</title>
    <style>
        /* Te ustawienia usuwają puste marginesy i rozciągają stronę z Canvy na pełny ekran */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .canva-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }
        /* Ukrywamy tekstowy link pod spodem, żeby strona wyglądała w 100% profesjonalnie */
        .canva-credits {
            display: none;
        }
    </style>
</head>
<body>

    <div class="canva-container">
        <iframe loading="lazy" src="https://www.canva.com/design/DAHSR3dw7Jk/V-cLMtAL53N2EBgWmsXfmw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
        </iframe>
    </div>

    <div class="canva-credits">
        <a href="https://canva.com" target="_blank" rel="noopener">Strona zapisu do klubu rowerowego</a> autorstwa Paweł
    </div>

</body>
</html>
